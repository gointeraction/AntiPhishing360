name: Detector360 CI & Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-and-test:
    name: Edge Forensic Engine, Anti-SSRF, XSS & C.I.C.P.C Security Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24 (Native TypeScript + node:sqlite D1 Simulator)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Execute Full 14-Stage Architecture & Security Verification Suite
        run: node tests/verify-all.ts
